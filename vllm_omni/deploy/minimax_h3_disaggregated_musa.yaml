# MiniMax H3 on one 8-GPU MUSA node.
# Requires the MUSA backend-neutral device-event fix for async video output.
# Without it, a second request can produce a structurally valid mosaic video.
#
# The text encoder uses two devices. The diffusion stage uses tensor parallel
# across four devices so each rank holds a shard of the DiT while the Video VAE
# uses the same four-rank patch-parallel group. Two devices remain available
# for process/runtime headroom. This layout avoids replicating the full DiT on
# every diffusion rank, which can exhaust S5000 memory during VAE decode.
pipeline: minimax_h3_disaggregated
async_chunk: false
trust_remote_code: true
distributed_executor_backend: mp

stages:
  - stage_id: 0
    devices: "0,1"
    max_num_seqs: 1
    tensor_parallel_size: 2
    default_sampling_params:
      max_tokens: 1
      temperature: 0.0
      detokenize: false

  - stage_id: 1
    devices: "2,3,4,5"
    max_num_seqs: 1
    model_loaded:
      text_encoder: false
    parallel_config:
      tensor_parallel_size: 4
      ulysses_degree: 1
      vae_patch_parallel_size: 4
    default_sampling_params:
      seed: 42
      num_inference_steps: 50
